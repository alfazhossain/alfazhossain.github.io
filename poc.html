<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Security PoC</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #050805;
      color: #39ff72;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    main { text-align: center; }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 5rem);
      line-height: 1.1;
      letter-spacing: .04em;
      text-shadow: 0 0 18px rgba(57,255,114,.35);
    }
    p {
      margin: 18px 0 0;
      color: #a8ffbd;
      font-size: clamp(.8rem, 2vw, 1rem);
    }
  </style>
</head>
<body>
  <main>
    <h1>POC BY ALFAZ HOSSAIN</h1>
    <p>Security research demonstration · No affiliation with the referenced organization</p>
  </main>
</body>
</html>
